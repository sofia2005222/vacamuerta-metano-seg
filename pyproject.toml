[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmseg"
version = "0.1.0"
description = "Segmentación de infraestructura de petróleo y gas (Vaca Muerta) en Sentinel-2 con etiquetas débiles"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: pruebas lentas (entrenan varios minutos en CPU)"]
