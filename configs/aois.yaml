# Áreas de interés (AOI). center = [lon, lat]; half_size_deg = mitad del lado de la caja en grados.
# 0.10° ≈ 11 km en latitud y ≈ 8.7 km en longitud a esta latitud (caja de unos 22 x 17 km).

sierra_barrosa:
  description: >
    Entorno de Sierra Barrosa / Aguada Toledo (Loma La Lata - Sierra Barrosa). El centro es la coordenada
    de unos tanques que la prensa (AADEAA, oct. 2026) vincula con el reporte de metano de PNUMA-IMEO de
    junio de 2026. Verificar la fuente original antes de citarla en el informe.
  center: [-68.83698, -38.76047]
  half_size_deg: 0.10

anelo:
  description: >
    Entorno de Añelo, zona de desarrollo no convencional intensivo. Centro APROXIMADO: ajustar mirando
    el mapa antes de descargar.
  center: [-68.787, -38.356]
  half_size_deg: 0.10
