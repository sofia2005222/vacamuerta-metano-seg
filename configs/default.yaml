# Configuración por defecto. Cualquier valor se puede pisar desde la línea de comandos:
#   python -m vmseg.cli train --config configs/default.yaml --set train.init=random --set train.epochs=5

data:
  root: data/processed        # carpeta generada por `build-patches` (index.csv + parches .npz)
  train_label: weak           # weak = etiquetas débiles | manual = etiquetas a mano
  eval_label: manual          # contra qué se mide val/test (cae a weak si no hay manuales)
  channels: null              # null = las 4 bandas (B,G,R,NIR). [2, 1, 0] = solo RGB (R,G,B)

model:
  encoder: resnet34
  init: imagenet              # imagenet | random | ruta a un checkpoint (p. ej. preentrenado en Alberta)

train:
  loss: bce_dice              # bce_dice | bootstrap_bce_dice
  bootstrap_beta: 0.8
  epochs: 30
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 1.0e-4
  num_workers: 2
  seed: 0
  threshold: 0.5
  out_dir: runs
  run_name: baseline
